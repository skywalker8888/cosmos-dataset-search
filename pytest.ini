[pytest]
# Pytest configuration for Cosmos Video Dataset Search

# Test discovery
testpaths = src
python_files = test_*.py *_test.py
python_functions = test_*
python_classes = Test*

# Test execution
addopts =
    -v
    --strict-markers
    --tb=short
    --durations=10
    --color=yes
    -n auto
    --dist loadgroup
    -p no:warnings
    --disable-warnings
    # src/triton/model_repository/aesthetic/model.py imports
    # src.triton.model_repository.clip.model, and the clip package is not
    # present in this repository. The module is unimportable, so its test
    # cannot even be collected -- a marker would not help, because collection
    # fails before markers are applied. Remove this ignore once clip is
    # restored.
    --ignore=src/triton/model_repository

# Test markers
markers =
    unit: Unit tests
    integration: Integration tests
    gpu: GPU tests requiring CUDA
    slow: Slow running tests
    single_concurrency: Tests requiring single concurrency
    skip: Skip tests
    smoke: Smoke tests for basic functionality
    performance: Performance tests

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
log_level = INFO

# Warnings
filterwarnings =
    ignore::Warning

# Timeout
timeout = 300

# Coverage
# "scripts" is excluded because src/visual_search/scripts/ holds integration
# *drivers* (run_integration_test.py, run_cosmos_video_integration_test.py)
# that match python_files but are not pytest modules. They are invoked by
# `make test-integration-run`.
norecursedirs = .git .tox venv env build dist *.egg node_modules scripts
